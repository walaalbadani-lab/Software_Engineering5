<div style="background: white; padding: 20px; border-radius: 10px; max-width: 500px; margin: auto; box-shadow: 0 0 10px rgba(0,0,0,0.1);">
    <h2 style="text-align: center; color: #333;">إضافة أو تعديل البيانات</h2>
    
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="background-color: #4CAF50; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 15px;">
            حفظ
        </button>
    </form>
</div>

{% if products %}
<div style="background: white; padding: 20px; border-radius: 10px; max-width: 500px; margin: 20px auto; box-shadow: 0 0 10px rgba(0,0,0,0.1);">
    <h3 style="color: #333;">المنتجات والدعوات الحالية:</h3>
    <ul style="padding: 0; list-style: none;">
        {% for p in products %}
            <li style="padding: 8px 0; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center;">
                <span>{{ p.name }} - {{ p.price }}</span>
                <a href="{% url 'edit_product_form' p.id %}" style="background-color: #ffc107; color: black; padding: 5px 10px; text-decoration: none; border-radius: 3px;">
                    تعديل
                </a>
            </li>
        {% endfor %}
    </ul>
</div>
{% endif %}
